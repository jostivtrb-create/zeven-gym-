<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="Zeven Gym — la app de tu gimnasio" />
    <link rel="manifest" href="/api/manifest" />
    <link rel="icon" type="image/png" href="/iconos/icono-192.png" />
    <link rel="apple-touch-icon" href="/iconos/icono-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zeven Gym" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Zeven Gym</title>
    <script>
      /* Identidad del gimnasio ANTES de que el navegador lea el manifest.
         Chrome captura el manifest al cargar la página: si el usuario ya entró
         a su gym alguna vez (queda en localStorage), la PWA se instala con el
         nombre y el logo de SU gimnasio, no con los de Zeven. */
      try {
        var zgCodigo = localStorage.getItem('zg-gym-codigo')
        var zgLogo = localStorage.getItem('zg-gym-logo')
        var zgNombre = localStorage.getItem('zg-gym-nombre')
        if (zgCodigo) {
          document.querySelector('link[rel="manifest"]').href = '/api/manifest?g=' + encodeURIComponent(zgCodigo)
        }
        if (zgLogo) {
          document.querySelector('link[rel="icon"]').href = zgLogo
          document.querySelector('link[rel="apple-touch-icon"]').href = zgLogo
        }
        if (zgNombre) {
          document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', zgNombre)
          document.title = zgNombre
        }
      } catch (e) { /* sin localStorage: se queda la identidad Zeven */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
